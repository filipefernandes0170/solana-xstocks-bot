# Netlify builds the Par desk website (onpar.site, Netlify project xstocks-tracker) from the site/ folder.
# The Telegram bot in the repo root is not a website and is never deployed by Netlify.
# Netlify skips a build when a push changes nothing inside site/ (it compares the base directory).
# Paths below are relative to the base directory.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
